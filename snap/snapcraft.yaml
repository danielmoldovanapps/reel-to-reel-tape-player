name: reel-to-reel-tape-player
title: Reel-to-Reel Tape Player
base: core24
version: '1.3.0'
summary: Vintage reel-to-reel music player with animated reels and VU meters
description: |
  A vintage-inspired reel-to-reel music player for Linux, supporting music
  from your computer and network locations. Enjoy animated tape reels,
  responsive VU meters, album artwork, a persistent playlist, and
  customizable deck and reel branding.

  You can also brand the interface to your liking. If you like the app,
  please consider donating to the developer.

  Proudly made by Daniel Moldovan, aka [RO]Daniel, from Brasov-Romania.
grade: stable
confinement: strict
license: GPL-3.0-only
contact: rodanielapps@yahoo.com
platforms:
  amd64:

slots:
  reelplayer-session:
    interface: dbus
    bus: session
    name: org.reelplayer.ReelPlayer

apps:
  reelplayer:
    command: bin/reelplayer
    extensions: [gnome]
    slots: [reelplayer-session]
    plugs: [home, removable-media, network, network-bind, audio-playback]

parts:
  player:
    plugin: nil
    source: .
    override-build: |
      set -eu
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/reelplayer" "$CRAFT_PART_INSTALL/bin"
      for item in reelplayer AppRun index.html tape-engine.js artwork.py streaminfo.py metadata-reader.js metadata-reader-LICENSES.txt icon.svg README.md STORE-DESCRIPTION.md donation-qr.png LICENSE COPYRIGHT THIRD-PARTY-NOTICES.txt crypto-donations vendor third_party; do
        cp -a "$CRAFT_PART_SRC/$item" "$CRAFT_PART_INSTALL/usr/share/reelplayer/"
      done
      cat > "$CRAFT_PART_INSTALL/bin/reelplayer" <<'LAUNCHER'
      #!/bin/sh
      set -eu
      export PATH="$SNAP/usr/bin:$PATH"
      export GIO_USE_PROXY_RESOLVER=dummy
      export LD_LIBRARY_PATH="$SNAP/usr/lib/x86_64-linux-gnu/blas:$SNAP/usr/lib/x86_64-linux-gnu/lapack${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      export PYTHONPATH="$SNAP/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
      export GI_TYPELIB_PATH="$SNAP/usr/lib/x86_64-linux-gnu/girepository-1.0${GI_TYPELIB_PATH:+:$GI_TYPELIB_PATH}"
      exec /usr/bin/python3 "$SNAP/usr/share/reelplayer/reelplayer" "$@"
      LAUNCHER
      chmod 755 "$CRAFT_PART_INSTALL/bin/reelplayer"
    stage-packages:
      - python3
      - python3-gi
      - gir1.2-gtk-3.0
      - gir1.2-webkit2-4.1
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-libav
      - ffmpeg
      - libblas3
      - liblapack3
      - zenity
    prime:
      - "-usr/lib/x86_64-linux-gnu/librsvg-2.so*"
